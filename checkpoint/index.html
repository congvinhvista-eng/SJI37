<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký / Đăng nhập Firebase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1 id="heading">Đăng nhập</h1>
      <p class="subtitle">Nhập email và mật khẩu của bạn</p>

      <div class="mode-buttons">
        <button id="loginMode" type="button" aria-pressed="true">Đăng nhập</button>
        <button id="registerMode" class="secondary" type="button" aria-pressed="false">Đăng ký</button>
      </div>

      <form id="authForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button id="submitButton" type="submit">Đăng ký/Đăng nhập</button>
      </form>

      <button id="googleButton" class="secondary" type="button">Đăng nhập bằng Google</button>
      <p id="userInfo" hidden>Đang đăng nhập bằng: <strong id="userEmail"></strong></p>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="logoutButton" class="secondary" type="button" hidden>Đăng xuất</button>
    </main>
    <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
